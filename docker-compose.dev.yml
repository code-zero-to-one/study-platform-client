# 개발(QA)환경(develop branch)에서 사용하는 docker-compose
# client-deploy-dev 워크플로우가 이 파일로 frontend-dev 를 띄운다.

services:
  frontend:
    container_name: frontend-dev
    image: zerooneitkr/frontend:develop
    # 도커허브에서 이미지 받아오니까 빌드과정은 빠짐
    # build:
    #   context: .
    #   dockerfile: Dockerfile.dev
    ports:
      - '14855:14855'
    env_file:
      - .env
    restart: unless-stopped
    # frontend-dev 는 백엔드를 공개 URL(NEXT_PUBLIC_API_BASE_URL)로만 호출하므로
    # 백엔드 docker 네트워크(zeroone-net-qa)에 붙지 않는다. 이래야 백엔드 배포가
    # 그 네트워크를 down/up 으로 깨끗이 재생성(자가복구)할 수 있다.
